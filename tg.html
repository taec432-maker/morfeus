<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Telegram-канал Morfeus</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14062a;color:#fff;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center}
  .box{padding:24px 18px;max-width:360px}
  .ic{width:84px;height:84px;border-radius:24px;background:#2aabee;display:grid;place-items:center;margin:0 auto 14px}
  h1{font-size:23px;margin:0 0 6px}
  p{margin:0 0 16px;color:rgba(255,255,255,.75);font-size:15px}
  a.b{display:block;margin:0 0 10px;padding:15px;border-radius:999px;font-weight:800;text-decoration:none}
  a.main{background:#2aabee;color:#fff}
  a.sec{background:rgba(255,255,255,.12);color:#fff}
  button{border:0;background:none;color:#ffe39a;font:inherit;font-size:15px;padding:10px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="ic"><svg width="46" height="46" viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.6 18.7 19.7c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9-8.2c.4-.4-.1-.6-.6-.2L6.3 13.3l-4.8-1.5c-1-.3-1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.6z"/></svg></div>
  <h1>Telegram-канал Morfeus</h1>
  <p>@morpheus22222</p>
  <a class="b main" href="tg://resolve?domain=morpheus22222">Открыть в Telegram</a>
  <a class="b sec" href="https://t.me/s/morpheus22222">Читать канал здесь</a>
  <button id="cp">📋 Скопировать ссылку</button>
</div>
<script>
(function(){
  // сразу пробуем открыть приложение Telegram
  if(!/[?&]noauto=1/.test(location.search)) setTimeout(function(){ location.href='tg://resolve?domain=morpheus22222' }, 300);
  document.getElementById('cp').addEventListener('click',function(){
    var b=this, u='https://t.me/morpheus22222', ok=function(){ b.textContent='Скопировано ✓' };
    function fb(){ var a=document.createElement('textarea'); a.value=u; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(x){} a.remove(); ok() }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(ok,fb) } else fb();
  });
})();
</script>
</body>
</html>
